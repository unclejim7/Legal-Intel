<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Intel — Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111009;
    --bg-card: #1c1a13;
    --bg-card-hover: #252218;
    --paper: #f5f0e8;
    --paper-dim: #c8b898;
    --ink: #e8dfc8;
    --rule: #3a3220;
    --accent: #c04040;
    --accent-gold: #c8960c;
    --text-muted: #8a7e68;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  /* NAV */
  .top-nav {
    background: #0a0904;
    border-bottom: 1px solid var(--rule);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .top-nav a {
    color: var(--paper-dim);
    text-decoration: none;
    transition: color 0.2s;
  }
  .top-nav a:hover { color: var(--accent-gold); }
  .top-nav .brand {
    font-family: 'UnifrakturMaguntia', cursive;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
  }

  /* HEADER */
  .archive-header {
    text-align: center;
    padding: 52px 24px 36px;
    border-bottom: 1px solid var(--rule);
  }
  .archive-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .archive-header p {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* WRAPPER */
  .wrapper {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* MONTH GROUP */
  .month-group {
    margin-top: 42px;
  }
  .month-label {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-gold);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 6px;
  }

  /* EDITION CARD */
  .edition-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-card);
    border: 1px solid var(--rule);
    margin-bottom: 6px;
    transition: background 0.2s, border-color 0.2s;
    text-decoration: none;
    color: inherit;
  }
  .edition-card:hover {
    background: var(--bg-card-hover);
    border-color: #5a5040;
  }
  .edition-card .date-block .day-of-week {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .edition-card .date-block .full-date {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }
  .edition-card .badges {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge-latest {
    background: var(--accent);
    color: #f5f0e8;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 3px 9px;
  }
  .badge-vol {
    font-family: 'Libre Franklin', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .read-btn {
    background: transparent;
    border: 1px solid #5a5040;
    color: var(--paper-dim);
    font-family: 'Libre Franklin', sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    text-decoration: none;
  }
  .edition-card:hover .read-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #f5f0e8;
  }

  /* FOOTER */
  .archive-footer {
    text-align: center;
    padding: 48px 24px 36px;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-top: 1px solid var(--rule);
    margin-top: 56px;
  }
</style>
</head>

      <div class="date-block">
        <div class="day-of-week">Friday</div>

      <div class="badges">
        <span class="badge-latest">Latest</span>

</div><!-- end wrapper -->

<div class="archive-footer">

</body>
</html>
